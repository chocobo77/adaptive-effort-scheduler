# Installed bundle patch layer.
# Applied by `dsh plugin --profile <profile> add <this directory or tgz>`,
# or by the plugin manager's install_bundle with this package name.
#
# Bare subpath specifiers resolve through node_modules against the installed
# package's exports map; relative paths resolve against the PROFILE directory
# and break bundle installs, so keep the package name here (dev mounting from
# this directory lives in cordis.yml instead).
#
# THE THRESHOLDS BELOW ARE CALIBRATED FOR THIS DEPLOYMENT; the code defaults are
# still the upstream constants. Why they move: both heavy gates read cumulative
# signals, which only grow inside a long tool-heavy session and never fall back
# after a fold, so the upstream 6 / 60000 latch `high` early and stay there; and
# a Harness user message carries injected framework text that inflates the ask
# size, so the upstream 4000 misjudges short follow-ups inside a long session.
# Re-measure for your own workload with scripts/calibration-replay.mjs and
# scripts/gate-attribution.mjs before moving these numbers.

- insert:
    - id: adaptive-effort-scheduler
      name: '@local/adaptive-effort-scheduler'
      config:
        # --- what decides `high` ---
        # Tool results accumulated before the ask. Upstream used 6, which in a
        # tool-driven session is a latch that trips almost immediately; 200 keeps
        # it a late-session signal instead.
        heavyToolResults: 200
        # Estimated context tokens (session log only; see contextFloorTokens).
        heavyCtxTokens: 250000
        # Size of the ask, kept well above the upstream 4000 because a Harness
        # user message often carries injected framework text (task-state card,
        # retrieved context) that is not part of the human ask.
        heavyUserChars: 15000
        # --- what decides `low`: upstream values, untouched ---
        trivialUserChars: 160
        trivialCtxTokens: 4000
        # --- Harness calibration of the token gate (0 = faithful to upstream) ---
        contextFloorTokens: 0
        # --- KV relief ceiling: uncomment to retire `high` entirely. Every turn
        # then stays at `medium` or below, at the cost of no escalation in the
        # back half of a long session. ---
        # allowedEfforts: [low, medium]
        logDecisions: debug
