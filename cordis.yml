# Development composition — mount the scheduler without packaging it.
#
# `dsh` loads the built module straight from this directory, so a change is
# live after `apply` re-runs (plugin restart) with no bundle install. Point the
# row at ./src/index.ts instead if your loader runs TypeScript sources.
#
# Every key below is optional. The active values are the ones CALIBRATED for
# this deployment (see 「阈值标定」 in README.md); the upstream constants ported
# from OmniRoute `open-sse/services/adaptiveEffort.ts:33-37` are named in each
# comment. Omit `config` entirely to get the upstream constants.

- id: adaptive-effort-scheduler
  name: ./dist/index.js
  config:
    # --- what decides `low` (upstream values kept) ---
    # A user message this short can still count as a trivial ask. Upstream: 160.
    trivialUserChars: 160
    # A window this small (estimated tokens, 4 chars/token) can still be small. Upstream: 4000.
    trivialCtxTokens: 4000
    # --- what decides `high` (calibrated; upstream in parentheses) ---
    # Estimated context tokens at or above this is heavy work. Upstream: 60000 —
    # the count is cumulative, so in a long session that value latches `high` for
    # good; 250000 keeps it a late-session signal.
    heavyCtxTokens: 250000
    # Tool results accumulated before the ask. Upstream: 6 — also cumulative and
    # never reset by folding, so at that value it is a latch rather than a signal.
    heavyToolResults: 200
    # Size of the ask. Upstream: 4000 — a Harness user message carries injected
    # framework text (task-state card, retrieved context) that is not part of the
    # human ask, so 4000 punishes short questions inside long sessions.
    heavyUserChars: 15000
    # Calibration for the token gate. Upstream counted the whole request body
    # (system prompt + tool schemas included); the Harness session log keeps
    # those outside the message list, so the measured number here is
    # systematically smaller. 0 = faithful to upstream. With the calibrated
    # heavy gate at 250000 the floor no longer decides anything on its own, so
    # it stays at 0 until a re-measurement says otherwise.
    contextFloorTokens: 0
    # A hand-picked effort is not a hand-over: it rules the turn it lands in (the
    # scheduler never writes inside an open turn) and the next turn re-pins by
    # band. There is no key to configure here — see 「已知行为」 in README.md.
    # Publish each pin to a process-wide registry (Symbol.for key) so plugins
    # that mirror the session effort into auxiliary calls (fold summary, session
    # title, auto-review) can tell a machine pin from a human choice.
    publishPins: true
    # --- KV relief ceiling ---
    # Ceiling on what may be written, intersected with the route's declared
    # levels: every turn then stays at `medium` or below, with no escalation in
    # the back half of a long session. Also the fix for a separately configured
    # summarization model inheriting an effort its route would reject.
    # allowedEfforts: [low, medium]
    # Where decision lines go: debug (default) | info | none. Raise to `info` for
    # a calibration run so the pin lines survive a quieter log level.
    logDecisions: debug
